name: Windows desktop
on:
  workflow_dispatch:
  push:
    paths: ['Windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Mirror-Windows-x64
          path: |
            Windows/release/*.exe
            Windows/release/*.blockmap
            Windows/test-results/*.png
          if-no-files-found: error
